name: Backfill Linux game

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing rebellion2 release ref
        required: true
        type: string
      asset_ref:
        description: Existing rebellion2-media release ref
        required: true
        type: string
      version:
        description: Existing game release version
        required: true
        type: string
      launcher_version:
        description: Published launcher version to embed
        required: true
        type: string
      publish:
        description: Publish Linux and add it to an existing split game channel
        required: true
        default: false
        type: boolean
      confirm_backfill:
        description: Confirm this adds Linux to an existing published game version
        required: true
        default: false
        type: boolean

concurrency:
  group: game-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Linux backfill
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          tag="v${VERSION}"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  player-linux:
    name: Build Linux game
    needs: prepare
    uses: ./.github/workflows/build-player.yml
    with:
      artifact: player-linux
      asset_ref: ${{ inputs.asset_ref }}
      source_ref: ${{ inputs.source_ref }}
      target: StandaloneLinux64
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  package-linux:
    name: Package Linux game
    runs-on: ubuntu-22.04
    needs: [prepare, player-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: player-linux
          path: player

      - name: Package Linux game layer
        run: |
          set -euo pipefail
          chmod +x player/Rebellion2.x86_64
          if [ -f player/UnityCrashHandler64 ]; then chmod +x player/UnityCrashHandler64; fi
          node scripts/package-update-layer.mjs \
            player \
            "${{ needs.prepare.outputs.version }}" \
            game-manifest-linux.json \
            game-blobs-linux

      - name: Download the selected Linux launcher bundle
        env:
          CHANNEL_BASE: ${{ secrets.REB2_CONTENT_BASE_URL }}
          LAUNCHER_VERSION: ${{ inputs.launcher_version }}
        run: |
          set -euo pipefail
          base="${CHANNEL_BASE%/}"
          curl --fail --location --silent --show-error "$base/dist/launcher.json" -o launcher.json
          published_version="$(jq -er '.version | select(length > 0)' launcher.json)"
          test "$published_version" = "$LAUNCHER_VERSION"
          launcher_manifest="$(jq -er '.platforms.linux.manifest | select(length > 0)' launcher.json)"
          curl --fail --location --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/launcher-v${LAUNCHER_VERSION}/Rebellion2-launcher-Linux.tar.gz" \
            -o launcher.tar.gz
          mkdir launcher-bundle
          tar -xzf launcher.tar.gz -C launcher-bundle
          curl --fail --location --silent --show-error \
            "$base/$launcher_manifest" \
            -o launcher-manifest-linux.json
          printf '%s' "$LAUNCHER_VERSION" > launcher-version.txt
          test -f launcher-bundle/Rebellion2-launcher-Linux.AppImage
          test -f launcher-bundle/rebellion2-update-helper

      - name: Assemble Linux AppImage
        env:
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool | sha256sum --check
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" bash packaging/linux/build-appimage.sh \
            launcher-bundle/Rebellion2-launcher-Linux.AppImage \
            launcher-bundle/rebellion2-update-helper \
            player \
            launcher-manifest-linux.json \
            "$(cat launcher-version.txt)" \
            game-manifest-linux.json \
            "${{ needs.prepare.outputs.version }}" \
            "Rebellion2-${{ needs.prepare.outputs.version }}-x86_64.AppImage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-linux-backfill
          path: |
            Rebellion2-${{ needs.prepare.outputs.version }}-x86_64.AppImage
            game-manifest-linux.json
            game-blobs-linux
          if-no-files-found: error

  publish:
    name: Publish Linux game backfill
    if: inputs.publish && inputs.confirm_backfill
    runs-on: ubuntu-latest
    needs: [prepare, package-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: game-linux-backfill
          path: linux

      - name: Publish Linux backfill
        env:
          CHANNEL_BASE: ${{ secrets.REB2_CONTENT_BASE_URL }}
          GAME_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          manifest="linux/game-manifest-linux.json"
          manifest_path="dist/game-manifest-linux-${VERSION}.json"
          signature="$(node -e '
            const c=require("crypto"),fs=require("fs");
            const seed=Buffer.from(process.env.GAME_SIGNING_KEY.trim(),"hex");
            const pkcs8=Buffer.concat([Buffer.from("302e020100300506032b657004220420","hex"),seed]);
            const key=c.createPrivateKey({key:pkcs8,format:"der",type:"pkcs8"});
            process.stdout.write(c.sign(null,fs.readFileSync(process.argv[1]),key).toString("hex"));
          ' "$manifest")"

          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          export RCLONE_S3_PROVIDER="$STORAGE_PROVIDER"
          export RCLONE_S3_ACCESS_KEY_ID="$STORAGE_ACCESS_KEY_ID"
          export RCLONE_S3_SECRET_ACCESS_KEY="$STORAGE_SECRET_ACCESS_KEY"
          export RCLONE_S3_ENDPOINT="$STORAGE_ENDPOINT"
          export RCLONE_S3_REGION=auto
          remote=":s3:${STORAGE_BUCKET}"

          gh release upload "$TAG" \
            "linux/Rebellion2-${VERSION}-x86_64.AppImage" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx "Rebellion2-${VERSION}-x86_64.AppImage"

          pointer_listing="$(rclone lsf "${remote}/dist" --files-only --include game.json)"
          if ! grep -Fxq game.json <<< "$pointer_listing"; then
            echo "No split game channel exists; leaving the global channel unchanged."
            exit 0
          fi
          rclone cat "${remote}/dist/game.json" > current-game.json
          node scripts/add-game-platform.mjs \
            current-game.json \
            game-with-linux.json \
            "$VERSION" \
            linux \
            "$manifest_path" \
            game-blobs/ \
            "$signature"

          rclone copy linux/game-blobs-linux "${remote}/game-blobs" --ignore-existing
          rclone copyto "$manifest" "${remote}/${manifest_path}"

          restore_pointer() {
            rclone copyto current-game.json "${remote}/dist/game.json"
          }
          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then restore_pointer; fi
            exit "$status"
          }
          trap on_exit EXIT
          rclone copyto game-with-linux.json "${remote}/dist/game.json"

          base="${CHANNEL_BASE%/}"
          published=false
          for _ in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error "$base/dist/game.json" \
              | jq -e \
                --arg version "$VERSION" \
                --arg manifest "$manifest_path" \
                '.version == $version and .platforms.linux.manifest == $manifest' >/dev/null; then
              published=true
              break
            fi
            sleep 5
          done
          test "$published" = true
          trap - EXIT
