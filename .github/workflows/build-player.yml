name: Build Player

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      asset_ref:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      target:
        required: true
        type: string
      unity_version:
        default: 6000.4.0f1
        required: false
        type: string
      version:
        required: true
        type: string
    secrets:
      ASSET_LFS_PROXY_URL:
        required: true
      ASSET_SOURCE_REPOSITORY:
        required: true
      REBELLION2_MEDIA_SSH_KEY:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      SOURCE_REPO_TOKEN:
        required: true
      STORAGE_BUCKET:
        required: true
      STORAGE_ENDPOINT:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_LICENSE:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false

      - name: Checkout game
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: davidadas/rebellion2
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: game

      - name: Checkout build assets (git only, no LFS)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.ASSET_SOURCE_REPOSITORY }}
          ref: ${{ inputs.asset_ref }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: game/.ci/assets

      - name: Fetch build assets
        working-directory: game/.ci/assets
        env:
          ASSET_LFS_PROXY_URL: ${{ secrets.ASSET_LFS_PROXY_URL }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
        run: |
          PROXY="${ASSET_LFS_PROXY_URL%/}"
          PROXY_HOST="${PROXY#https://}"
          STORAGE_HOST="${STORAGE_ENDPOINT#https://}"
          git config lfs.url "https://${STORAGE_ACCESS_KEY_ID}:${STORAGE_SECRET_ACCESS_KEY}@${PROXY_HOST}/${STORAGE_HOST}/${STORAGE_BUCKET}"
          # Keep concurrent release jobs from overwhelming the shared LFS proxy.
          git config lfs.concurrenttransfers 4
          max_attempts=6
          for attempt in $(seq 1 "$max_attempts"); do
            if git lfs pull --include="Content/**,Models/MainMenu/**" --exclude=""; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Asset fetch failed after ${max_attempts} attempts." >&2
              exit 1
            fi
            delay=$((30 * (2 ** (attempt - 1))))
            if [ "$delay" -gt 300 ]; then
              delay=300
            fi
            echo "Asset fetch attempt ${attempt}/${max_attempts} failed; retrying in ${delay} seconds."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu; then
            echo "Asset checkout still contains Git LFS pointers."
            exit 1
          fi

      - name: Install build assets
        working-directory: game
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu
          test -f .ci/assets/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/assets/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/assets/Models/MainMenu/ Assets/Art/Models/MainMenu/
          rm -rf .ci

      - name: Cache Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: game/Library
          key: Library-${{ inputs.target }}-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ inputs.target }}-

      - name: Build player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          unityVersion: ${{ inputs.unity_version }}
          targetPlatform: ${{ inputs.target }}
          buildName: Rebellion2
          buildsPath: build
          buildMethod: StandalonePlayerBuild.Build
          customParameters: -buildVersion ${{ inputs.version }}
          allowDirtyBuild: true

      - name: Upload Windows player
        if: inputs.target == 'StandaloneWindows64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact }}
          path: build/${{ inputs.target }}
          if-no-files-found: error

      - name: Archive macOS player
        if: inputs.target == 'StandaloneOSX'
        run: tar -czf player-macos.tar.gz -C build/StandaloneOSX .

      - name: Upload macOS player
        if: inputs.target == 'StandaloneOSX'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact }}
          path: player-macos.tar.gz
          if-no-files-found: error
