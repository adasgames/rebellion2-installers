[package]
name = "rebellion2-launcher"
version = "0.1.0"
description = "Rebellion II launcher — verifies ownership, downloads game content, and launches the game."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
open = "5"
urlencoding = "2"
ureq = "2"
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rebellion2-update-core = { path = "../update-core" }
ed25519-dalek = "2"
hex = "0.4"
quick-xml = { version = "0.41", features = ["serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "tokio"] }
getrandom = "0.3"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
