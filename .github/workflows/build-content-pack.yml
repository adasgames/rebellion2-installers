name: Build content pack

on:
  workflow_dispatch:
    inputs:
      asset_ref:
        description: rebellion2-media ref to package
        required: true
        default: main
        type: string
      pack_id:
        description: Stable lowercase content-pack ID
        required: true
        type: string
      pack_directory:
        description: Directory below Content/Packs
        required: true
        type: string
      display_name:
        description: Name shown in the launcher
        required: true
        type: string
      description:
        description: Short launcher description
        required: true
        type: string
      base_pack_id:
        description: Pack this content inherits from
        required: true
        default: classic-galactic-civil-war
        type: string
      version:
        description: Content-pack version
        required: true
        type: string
      publish:
        description: Publish the pack and update the catalog
        required: true
        default: false
        type: boolean
      allow_rollback:
        description: Allow this pack to move to an older version
        required: true
        default: false
        type: boolean

concurrency:
  group: content-pack-release
  cancel-in-progress: false

jobs:
  package:
    name: Package content pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate release inputs
        env:
          BASE_PACK_ID: ${{ inputs.base_pack_id }}
          PACK_DIRECTORY: ${{ inputs.pack_directory }}
          PACK_ID: ${{ inputs.pack_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$PACK_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$BASE_PACK_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$PACK_DIRECTORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]

      - name: Checkout media
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.ASSET_SOURCE_REPOSITORY }}
          ref: ${{ inputs.asset_ref }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: assets

      - name: Fetch content-pack media
        working-directory: assets
        env:
          ASSET_LFS_PROXY_URL: ${{ secrets.ASSET_LFS_PROXY_URL }}
          PACK_DIRECTORY: ${{ inputs.pack_directory }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          git lfs install
          proxy="${ASSET_LFS_PROXY_URL%/}"
          proxy_host="${proxy#https://}"
          storage_host="${STORAGE_ENDPOINT#https://}"
          git config lfs.url "https://${STORAGE_ACCESS_KEY_ID}:${STORAGE_SECRET_ACCESS_KEY}@${proxy_host}/${storage_host}/${STORAGE_BUCKET}"
          git config lfs.concurrenttransfers 4
          git lfs pull --include="Content/Packs/${PACK_DIRECTORY}/**" --exclude=""
          pack="Content/Packs/${PACK_DIRECTORY}"
          test -f "$pack/pack.xml"
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' "$pack"; then
            echo "Content-pack checkout still contains Git LFS pointers." >&2
            exit 1
          fi

      - name: Verify pack identity
        env:
          BASE_PACK_ID: ${{ inputs.base_pack_id }}
          PACK_DIRECTORY: ${{ inputs.pack_directory }}
          PACK_ID: ${{ inputs.pack_id }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(f"assets/Content/Packs/{os.environ['PACK_DIRECTORY']}/pack.xml").getroot()
          values = {child.tag: (child.text or '').strip() for child in root}
          assert values.get('ID') == os.environ['PACK_ID'], (values.get('ID'), os.environ['PACK_ID'])
          assert values.get('Version') == os.environ['VERSION'], (values.get('Version'), os.environ['VERSION'])
          assert values.get('BasePackID') == os.environ['BASE_PACK_ID'], (values.get('BasePackID'), os.environ['BASE_PACK_ID'])
          PY

      - name: Package immutable content pack
        env:
          BASE_PACK_ID: ${{ inputs.base_pack_id }}
          DESCRIPTION: ${{ inputs.description }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          PACK_DIRECTORY: ${{ inputs.pack_directory }}
          PACK_ID: ${{ inputs.pack_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/package-update-layer.mjs \
            "assets/Content/Packs/${PACK_DIRECTORY}" \
            "$VERSION" \
            "manifest.json" \
            "blobs"
          jq -n \
            --arg id "$PACK_ID" \
            --arg name "$DISPLAY_NAME" \
            --arg description "$DESCRIPTION" \
            --arg version "$VERSION" \
            --arg directory "$PACK_DIRECTORY" \
            --arg manifest "dist/content-packs/${PACK_ID}/manifest-${VERSION}.json" \
            --arg blobs "content-pack-blobs/" \
            --arg basePackId "$BASE_PACK_ID" \
            '{id:$id,name:$name,description:$description,version:$version,directory:$directory,manifest:$manifest,blobs:$blobs,basePackId:$basePackId}' \
            > release.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-pack
          path: |
            blobs
            manifest.json
            release.json
          if-no-files-found: error

  publish:
    name: Publish content pack
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: content-pack
          path: package

      - name: Publish pack before the atomic catalog pointer
        env:
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
          CHANNEL_BASE: ${{ secrets.REB2_CONTENT_BASE_URL }}
          PACK_ID: ${{ inputs.pack_id }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          export RCLONE_S3_PROVIDER="$STORAGE_PROVIDER"
          export RCLONE_S3_ACCESS_KEY_ID="$STORAGE_ACCESS_KEY_ID"
          export RCLONE_S3_SECRET_ACCESS_KEY="$STORAGE_SECRET_ACCESS_KEY"
          export RCLONE_S3_ENDPOINT="$STORAGE_ENDPOINT"
          export RCLONE_S3_REGION=auto
          remote=":s3:${STORAGE_BUCKET}"
          catalog=current-catalog.json
          previous_catalog=false
          if rclone lsf "${remote}/dist" --files-only --include content-packs.json | grep -Fxq content-packs.json; then
            rclone copyto "${remote}/dist/content-packs.json" "$catalog"
            previous_catalog=true
          else
            printf '%s\n' '{"schemaVersion":1,"packs":[]}' > "$catalog"
          fi
          current_version="$(jq -r --arg id "$PACK_ID" '.packs[] | select(.id==$id) | .version' "$catalog")"
          if [ -n "$current_version" ] && [ "$ALLOW_ROLLBACK" != true ] && [ "$(node scripts/semver.mjs "$VERSION" "$current_version")" = -1 ]; then
            echo "Refusing to move $PACK_ID backward from $current_version to $VERSION." >&2
            exit 1
          fi
          node scripts/update-content-pack-catalog.mjs \
            "$catalog" \
            package/release.json \
            package/manifest.json \
            content-packs.json
          rclone copy package/blobs "${remote}/content-pack-blobs" --ignore-existing
          rclone copyto \
            package/manifest.json \
            "${remote}/dist/content-packs/${PACK_ID}/manifest-${VERSION}.json"
          restore_catalog() {
            if [ "$previous_catalog" = true ]; then
              rclone copyto "$catalog" "${remote}/dist/content-packs.json"
            else
              rclone deletefile "${remote}/dist/content-packs.json" || true
            fi
          }
          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then restore_catalog; fi
            exit "$status"
          }
          trap on_exit EXIT
          rclone copyto content-packs.json "${remote}/dist/content-packs.json"
          base="${CHANNEL_BASE%/}"
          for _ in 1 2 3 4 5 6; do
            published="$(curl --fail --location --silent --show-error "$base/dist/content-packs.json" | jq -r --arg id "$PACK_ID" '.packs[] | select(.id==$id) | .version' || true)"
            [ "$published" = "$VERSION" ] && break
            sleep 5
          done
          test "$published" = "$VERSION"
          trap - EXIT
