[package]
name = "rebellion2-launcher"
version = "0.1.0"
description = "Rebellion II launcher — verifies ownership, downloads game content, and launches the game."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
urlencoding = "2"
ureq = "2"
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rebellion2-update-core = { path = "../update-core" }
ed25519-dalek = "2"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
strip = true
