name: Build Installers

# Tag-driven, launcher-model installer build.
#
# Push a tag like `v0.0.2` to cut a release: this builds the ASSET-FREE game
# player, builds the launcher, packages native Windows and macOS downloads, and
# publishes them to a GitHub Release named after the tag.
# Content (art) is NOT in the installer — the launcher downloads content.zip
# from R2 after ownership verification.
#
# workflow_dispatch is the escape hatch for test builds (no Release is cut).
#
# Windows and macOS are live. Linux remains parked below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "rebellion2 (game) ref to build"
        required: false
        default: "master"
      version:
        description: "Version string (blank = 0.0.0-dev for dispatch builds)"
        required: false
        default: ""

env:
  UNITY_VERSION: 6000.4.0f1

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="0.0.0-dev"
          fi
          echo "Resolved version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  player:
    name: Build asset-free player (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: StandaloneWindows64
            artifact: player-windows
          - name: macOS
            target: StandaloneOSX
            artifact: player-macos
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false

      # Pin the game to the release tag so builds are reproducible: a tag build checks
      # out rebellion2@<tag>; a dispatch build uses source_ref (default master).
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: game

      # Media (content pack + main-menu models) is needed at BUILD time for prefab
      # authoring/previews. StandalonePlayerBuild strips Assets/Content from the
      # final player and verifies it did not leak, so the shipped player stays
      # asset-free — the real content ships separately as content.zip on R2.
      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: game/.ci/rebellion2-media

      - name: Pull media LFS from R2
        working-directory: game/.ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          for attempt in 1 2 3; do
            if git lfs pull --include="Content/**,Models/MainMenu/**" --exclude=""; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Media LFS pull failed; retrying in ${delay} seconds."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu; then
            echo "Media checkout still contains Git LFS pointers."; exit 1
          fi

      - name: Install media (editor-preview content + main-menu models)
        working-directory: game
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu
          test -f .ci/rebellion2-media/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Models/MainMenu/ Assets/Art/Models/MainMenu/
          rm -rf .ci

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.target }}
          buildName: Rebellion2
          buildsPath: build
          buildMethod: StandalonePlayerBuild.Build
          customParameters: -buildVersion ${{ needs.prepare.outputs.version }}
          allowDirtyBuild: true

      - name: Upload Windows player
        if: matrix.target == 'StandaloneWindows64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.target }}
          if-no-files-found: error

      # Preserve the app bundle's executable modes and symlinks across the
      # Linux-to-macOS artifact handoff.
      - name: Archive macOS player
        if: matrix.target == 'StandaloneOSX'
        run: tar -czf player-macos.tar.gz -C build/StandaloneOSX .

      - name: Upload macOS player
        if: matrix.target == 'StandaloneOSX'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: player-macos.tar.gz
          if-no-files-found: error

  publish-content:
    name: Publish content + update layer to R2
    if: github.ref_type == 'tag'
    runs-on: macos-latest  # tar is bsdtar here, which package.sh needs for zip creation
    needs: prepare
    steps:
      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: media

      - name: Pull media LFS from R2
        working-directory: media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          git lfs install
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          for attempt in 1 2 3; do
            if git lfs pull --include="Content/**" --exclude=""; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Media LFS pull failed; retrying in ${delay} seconds."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content; then
            echo "Media checkout still contains Git LFS pointers."; exit 1
          fi

      - name: Checkout infrastructure (publish script)
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2-infrastructure
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: infra

      - name: Install rclone
        run: brew install rclone

      # Publishes dist/content-<ver>.zip (first-install), plus the incremental
      # update layer the launcher patches from: dist/manifest-<ver>.json,
      # blobs/<sha256>, and dist/latest.json. Derived from one file set so they
      # can't drift.
      - name: Publish content.zip + manifest + blobs + latest.json
        env:
          MEDIA_DIR: ${{ github.workspace }}/media
          VERSION: ${{ needs.prepare.outputs.version }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash infra/content/package.sh

  windows-installer:
    name: Package Windows installer
    runs-on: windows-latest
    needs: [prepare, player]
    steps:
      - name: Checkout installer repo (packaging)
        uses: actions/checkout@v4

      - name: Download player
        uses: actions/download-artifact@v4
        with:
          name: player-windows
          path: player

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify update channel
        shell: pwsh
        env:
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REB2_CONTENT_BASE_URL)) {
            throw "REB2_CONTENT_BASE_URL is not configured."
          }
          $baseUrl = $env:REB2_CONTENT_BASE_URL.TrimEnd("/")
          $pointer = Invoke-RestMethod "$baseUrl/dist/latest.json"
          if (-not $pointer.version) {
            throw "The configured update channel did not return a content pointer."
          }

      - name: Build launcher
        working-directory: launcher/src-tauri
        env:
          # Baked into the launcher so it requests its own content pack (content-<ver>.zip).
          # The version IS the release tag — game and media are checked out at that tag.
          REB2_CONTENT_VERSION: ${{ needs.prepare.outputs.version }}
          # Content channel the launcher scans for updates and pulls token-gated
          # patches from. Kept in a repo secret so the worker URL isn't committed.
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: cargo build --release

      - name: Stamp game exe icon
        shell: pwsh
        run: |
          choco install rcedit -y --no-progress
          rcedit "player\Rebellion2.exe" --set-icon "launcher\src-tauri\icons\icon.ico"

      - name: Package application update layer
        shell: pwsh
        run: |
          $payloadRoot = Join-Path $PWD "application-update"
          $metadataRoot = Join-Path $PWD "application-update-metadata"
          $blobsRoot = Join-Path $metadataRoot "application-blobs"
          New-Item -ItemType Directory -Force $payloadRoot | Out-Null
          New-Item -ItemType Directory -Force $blobsRoot | Out-Null
          cargo build --release --manifest-path launcher/self-update/Cargo.toml
          Copy-Item -Path "player\*" -Destination $payloadRoot -Recurse -Force
          Copy-Item `
            -LiteralPath "launcher\src-tauri\target\release\rebellion2-launcher.exe" `
            -Destination $payloadRoot `
            -Force
          Copy-Item `
            -LiteralPath "launcher\self-update\target\release\rebellion2-self-update.exe" `
            -Destination (Join-Path $payloadRoot "rebellion2-update-helper.exe") `
            -Force
          if (Test-Path -LiteralPath (Join-Path $payloadRoot "Content")) {
            throw "The application update payload must remain asset-free."
          }
          $files = @(
            Get-ChildItem -LiteralPath $payloadRoot -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $blobPath = Join-Path $blobsRoot $hash
                if (-not (Test-Path -LiteralPath $blobPath)) {
                  Copy-Item -LiteralPath $_.FullName -Destination $blobPath
                }
                [ordered]@{
                  path = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\', '/')
                  sha256 = $hash
                  size = $_.Length
                }
              }
          )
          $manifest = [ordered]@{
            version = "${{ needs.prepare.outputs.version }}"
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 4 -Compress |
            Set-Content -LiteralPath (Join-Path $metadataRoot "application-manifest.json") -Encoding utf8
          Set-Content `
            -LiteralPath (Join-Path $metadataRoot "application-version.txt") `
            -Value "${{ needs.prepare.outputs.version }}" `
            -NoNewline

      - name: Package installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc `
            /DGameDir="$PWD\player" `
            /DLauncherPath="$PWD\launcher\src-tauri\target\release\rebellion2-launcher.exe" `
            /DUpdateHelperPath="$PWD\launcher\self-update\target\release\rebellion2-self-update.exe" `
            /DApplicationManifestPath="$PWD\application-update-metadata\application-manifest.json" `
            /DApplicationVersionPath="$PWD\application-update-metadata\application-version.txt" `
            /DAppVersion="${{ needs.prepare.outputs.version }}" `
            /DOutputDir="$PWD\dist" `
            /DIconFile="$PWD\launcher\src-tauri\icons\icon.ico" `
            packaging\windows\rebellion2-launcher.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*-Setup.exe
          if-no-files-found: error

      - name: Upload application update layer
        uses: actions/upload-artifact@v4
        with:
          name: application-update-layer
          path: application-update-metadata
          if-no-files-found: error

  macos-installer:
    name: Package macOS application
    runs-on: macos-latest
    needs: [prepare, player]
    steps:
      - name: Checkout installer repo (packaging)
        uses: actions/checkout@v4

      - name: Download player
        uses: actions/download-artifact@v4
        with:
          name: player-macos
          path: player-archive

      - name: Extract player
        run: |
          mkdir player
          tar -xzf player-archive/player-macos.tar.gz -C player

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Verify update channel
        env:
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${REB2_CONTENT_BASE_URL:-}" ]; then
            echo "REB2_CONTENT_BASE_URL is not configured." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error "${REB2_CONTENT_BASE_URL%/}/dist/latest.json" |
            python3 -c 'import json,sys; pointer=json.load(sys.stdin); assert pointer.get("version"), "The configured update channel did not return a content pointer."'

      - name: Build universal launcher app
        working-directory: launcher/src-tauri
        env:
          REB2_CONTENT_VERSION: ${{ needs.prepare.outputs.version }}
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: |
          jq --arg version "$REB2_CONTENT_VERSION" '.version = $version' \
            tauri.conf.json > tauri.release.conf.json
          cargo tauri build \
            --config tauri.release.conf.json \
            --target universal-apple-darwin \
            --bundles app

      - name: Package application
        run: |
          bash packaging/macos/build-zip.sh \
            "launcher/src-tauri/target/universal-apple-darwin/release/bundle/macos/Rebellion II.app" \
            "$PWD/player" \
            "${{ needs.prepare.outputs.version }}" \
            "$PWD/dist/Rebellion2-${{ needs.prepare.outputs.version }}-macOS.zip"

      - name: Verify packaged application
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          ditto -x -k "dist/Rebellion2-${{ needs.prepare.outputs.version }}-macOS.zip" "$work"
          test -x "$work/Rebellion2.app/Contents/MacOS/rebellion2-launcher"
          test -d "$work/Rebellion2.app/Contents/Resources/Rebellion2 Game.app"
          test -n "$(find "$work/Rebellion2.app/Contents/Resources/Rebellion2 Game.app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          codesign --verify --deep --strict "$work/Rebellion2.app"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*-macOS.zip
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [prepare, publish-content, windows-installer, macos-installer]
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: dist

      - name: Download macOS application
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: dist

      - name: Download application update layer
        uses: actions/download-artifact@v4
        with:
          name: application-update-layer
          path: application-update-metadata

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rebellion 2 ${GITHUB_REF_NAME}" \
            --notes "Automated build of Rebellion 2 ${GITHUB_REF_NAME}. Unsigned; see README for install notes. The installer is asset-free — the launcher downloads game content after ownership verification." \
            dist/*-Setup.exe \
            dist/*-macOS.zip

      - name: Sign and publish application update layer
        env:
          LAUNCHER_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST=application-update-metadata/application-manifest.json
          # Ed25519-sign the manifest bytes so every application path and blob hash is authenticated.
          SIG=$(node -e '
            const c=require("crypto"),fs=require("fs");
            const seed=Buffer.from(process.env.LAUNCHER_SIGNING_KEY.trim(),"hex");
            const pkcs8=Buffer.concat([Buffer.from("302e020100300506032b657004220420","hex"),seed]);
            const key=c.createPrivateKey({key:pkcs8,format:"der",type:"pkcs8"});
            process.stdout.write(c.sign(null,fs.readFileSync(process.argv[1]),key).toString("hex"));
          ' "$MANIFEST")
          printf '{"version":"%s","manifest":"dist/application-manifest-%s.json","blobs":"application-blobs/","signature":"%s"}' "$VERSION" "$VERSION" "$SIG" > application.json
          echo "application.json -> $(cat application.json)"
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          export RCLONE_S3_PROVIDER=Cloudflare
          export RCLONE_S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_S3_ENDPOINT="$R2_ENDPOINT"
          export RCLONE_S3_REGION=auto
          rclone copyto "$MANIFEST" ":s3:${R2_BUCKET}/dist/application-manifest-${VERSION}.json"
          rclone copy application-update-metadata/application-blobs ":s3:${R2_BUCKET}/application-blobs"
          rclone copyto application.json ":s3:${R2_BUCKET}/dist/application.json"

  # ---------------------------------------------------------------------------
  # PARKED: Linux installer.
  #
  # Linux still needs a matching player matrix entry, a native Tauri launcher,
  # AppImage packaging, and per-platform application updates.
  # ---------------------------------------------------------------------------
