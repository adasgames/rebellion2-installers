name: Build Windows Installer

# Tag-driven, launcher-model installer build.
#
# Push a tag like `windows-0.0.2` to cut a release: this builds the ASSET-FREE
# Windows player, packages the launcher, and publishes release `v0.0.2`.
# Content (art) is NOT in the installer — the launcher downloads content.zip
# from R2 after ownership verification.
#
# workflow_dispatch is the escape hatch for test builds (no Release is cut).
#
# macOS is built separately from a `macos-*` tag so its runner cost is opt-in.

on:
  push:
    tags:
      - "windows-*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "rebellion2 (game) ref to build"
        required: false
        default: "master"
      version:
        description: "Version string (blank = 0.0.0-dev for dispatch builds)"
        required: false
        default: ""

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - id: v
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            [[ "$GITHUB_REF_NAME" =~ ^windows-[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Invalid Windows release tag: $GITHUB_REF_NAME" >&2
              exit 1
            }
            V="${GITHUB_REF_NAME#windows-}"
          elif [ -n "$REQUESTED_VERSION" ]; then
            V="$REQUESTED_VERSION"
          else
            V="0.0.0-dev"
          fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $V" >&2
            exit 1
          }
          echo "Resolved version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$V" >> "$GITHUB_OUTPUT"

  player-windows:
    name: Build asset-free player (Windows)
    needs: prepare
    uses: ./.github/workflows/build-player.yml
    with:
      artifact: player-windows
      media_ref: ${{ github.ref_type == 'tag' && needs.prepare.outputs.release_tag || 'main' }}
      source_ref: ${{ github.ref_type == 'tag' && needs.prepare.outputs.release_tag || inputs.source_ref || 'master' }}
      target: StandaloneWindows64
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish-content:
    name: Publish content + update layer to R2
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false

      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ github.ref_type == 'tag' && needs.prepare.outputs.release_tag || 'main' }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: media

      - name: Pull media LFS from R2
        working-directory: media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          git lfs install
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          for attempt in 1 2 3; do
            if git lfs pull --include="Content/**" --exclude=""; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Media LFS pull failed; retrying in ${delay} seconds."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content; then
            echo "Media checkout still contains Git LFS pointers."; exit 1
          fi

      - name: Checkout infrastructure (publish script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: davidadas/rebellion2-infrastructure
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: infra

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools rclone

      - name: Verify staged-publication support
        run: grep -q 'legacy latest.json unchanged' infra/content/package.sh

      # Uploads dist/content-<ver>.zip (first-install), plus the incremental
      # manifest and blobs. The generated latest.json remains staged until the
      # final release job succeeds, so incomplete releases never become live.
      - name: Stage content archive + manifest + blobs
        env:
          MEDIA_DIR: ${{ github.workspace }}/media
          VERSION: ${{ needs.prepare.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/content-package
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash infra/content/package.sh

      - name: Stage content pointer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-pointer
          path: ${{ runner.temp }}/content-package/latest.json
          if-no-files-found: error

  windows-installer:
    name: Package Windows installer
    runs-on: windows-latest
    needs: [prepare, player-windows]
    steps:
      - name: Checkout installer repo (packaging)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download player
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: player-windows
          path: player

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Verify update channel
        shell: pwsh
        env:
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REB2_CONTENT_BASE_URL)) {
            throw "REB2_CONTENT_BASE_URL is not configured."
          }
          $baseUrl = $env:REB2_CONTENT_BASE_URL.TrimEnd("/")
          $pointer = Invoke-RestMethod "$baseUrl/dist/latest.json"
          if (-not $pointer.version) {
            throw "The configured update channel did not return a content pointer."
          }

      - name: Build launcher
        working-directory: launcher/src-tauri
        env:
          # Baked into the launcher so it requests its own content pack (content-<ver>.zip).
          # The version IS the release tag — game and media are checked out at that tag.
          REB2_CONTENT_VERSION: ${{ needs.prepare.outputs.version }}
          # Content channel the launcher scans for updates and pulls token-gated
          # patches from. Kept in a repo secret so the worker URL isn't committed.
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: cargo build --release

      - name: Stamp game exe icon
        shell: pwsh
        run: |
          choco install rcedit -y --no-progress
          rcedit "player\Rebellion2.exe" --set-icon "launcher\src-tauri\icons\icon.ico"

      - name: Package application update layer
        shell: pwsh
        run: |
          $payloadRoot = Join-Path $PWD "application-update"
          $metadataRoot = Join-Path $PWD "application-update-metadata"
          $blobsRoot = Join-Path $metadataRoot "application-blobs"
          New-Item -ItemType Directory -Force $payloadRoot | Out-Null
          New-Item -ItemType Directory -Force $blobsRoot | Out-Null
          cargo build --release --manifest-path launcher/self-update/Cargo.toml
          Copy-Item -Path "player\*" -Destination $payloadRoot -Recurse -Force
          Copy-Item `
            -LiteralPath "launcher\src-tauri\target\release\rebellion2-launcher.exe" `
            -Destination $payloadRoot `
            -Force
          Copy-Item `
            -LiteralPath "launcher\self-update\target\release\rebellion2-self-update.exe" `
            -Destination (Join-Path $payloadRoot "rebellion2-update-helper.exe") `
            -Force
          if (Test-Path -LiteralPath (Join-Path $payloadRoot "Content")) {
            throw "The application update payload must remain asset-free."
          }
          $files = @(
            Get-ChildItem -LiteralPath $payloadRoot -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $blobPath = Join-Path $blobsRoot $hash
                if (-not (Test-Path -LiteralPath $blobPath)) {
                  Copy-Item -LiteralPath $_.FullName -Destination $blobPath
                }
                [ordered]@{
                  path = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\', '/')
                  sha256 = $hash
                  size = $_.Length
                }
              }
          )
          $manifest = [ordered]@{
            version = "${{ needs.prepare.outputs.version }}"
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 4 -Compress |
            Set-Content -LiteralPath (Join-Path $metadataRoot "application-manifest.json") -Encoding utf8
          Set-Content `
            -LiteralPath (Join-Path $metadataRoot "application-version.txt") `
            -Value "${{ needs.prepare.outputs.version }}" `
            -NoNewline

      - name: Package installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc `
            /DGameDir="$PWD\player" `
            /DLauncherPath="$PWD\launcher\src-tauri\target\release\rebellion2-launcher.exe" `
            /DUpdateHelperPath="$PWD\launcher\self-update\target\release\rebellion2-self-update.exe" `
            /DApplicationManifestPath="$PWD\application-update-metadata\application-manifest.json" `
            /DApplicationVersionPath="$PWD\application-update-metadata\application-version.txt" `
            /DAppVersion="${{ needs.prepare.outputs.version }}" `
            /DOutputDir="$PWD\dist" `
            /DIconFile="$PWD\launcher\src-tauri\icons\icon.ico" `
            packaging\windows\rebellion2-launcher.iss

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-windows
          path: dist/*-Setup.exe
          if-no-files-found: error

      - name: Upload application update layer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-update-layer
          path: application-update-metadata
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [prepare, publish-content, windows-installer]
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-windows
          path: dist

      - name: Download application update layer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: application-update-layer
          path: application-update-metadata

      - name: Download staged content pointer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: content-pointer
          path: content-pointer

      - name: Name Windows download
        run: mv dist/*-Setup.exe dist/Rebellion2-Windows-Setup.exe

      - name: Stage draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" \
              dist/Rebellion2-Windows-Setup.exe \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Rebellion 2 $RELEASE_TAG" \
              --notes "Automated Windows build of Rebellion 2 $RELEASE_TAG. Unsigned; see README for install notes. The installer is asset-free — the launcher downloads game content after ownership verification. The macOS archive is published separately." \
              dist/Rebellion2-Windows-Setup.exe
          fi

      - name: Publish verified application and content release
        env:
          LAUNCHER_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          MANIFEST=application-update-metadata/application-manifest.json
          CONTENT_POINTER=content-pointer/latest.json
          jq -e --arg version "$VERSION" '
            .version == $version and
            .zip == "dist/content-\($version).zip" and
            .manifest == "dist/manifest-\($version).json" and
            .blobs == "blobs/"
          ' "$CONTENT_POINTER" >/dev/null
          jq -e --arg version "$VERSION" '.version == $version' "$MANIFEST" >/dev/null
          # Ed25519-sign the manifest bytes so every application path and blob hash is authenticated.
          SIG=$(node -e '
            const c=require("crypto"),fs=require("fs");
            const seed=Buffer.from(process.env.LAUNCHER_SIGNING_KEY.trim(),"hex");
            const pkcs8=Buffer.concat([Buffer.from("302e020100300506032b657004220420","hex"),seed]);
            const key=c.createPrivateKey({key:pkcs8,format:"der",type:"pkcs8"});
            process.stdout.write(c.sign(null,fs.readFileSync(process.argv[1]),key).toString("hex"));
          ' "$MANIFEST")
          jq -n \
            --arg version "$VERSION" \
            --arg manifest "dist/application-manifest-${VERSION}.json" \
            --arg signature "$SIG" \
            --slurpfile content "$CONTENT_POINTER" \
            '{version:$version,manifest:$manifest,blobs:"application-blobs/",signature:$signature,content:$content[0]}' \
            > application.json
          echo "application.json -> $(cat application.json)"
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          export RCLONE_S3_PROVIDER=Cloudflare
          export RCLONE_S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_S3_ENDPOINT="$R2_ENDPOINT"
          export RCLONE_S3_REGION=auto
          REMOTE=":s3:${R2_BUCKET}"

          # Immutable versioned content must already exist before any live pointer moves.
          test "$(rclone cat "${REMOTE}/dist/manifest-${VERSION}.json" | jq -r .version)" = "$VERSION"
          rclone lsf "${REMOTE}/dist" --files-only --include "content-${VERSION}.zip" |
            grep -Fx "content-${VERSION}.zip"

          # Upload and verify the immutable application layer before publication.
          rclone copyto "$MANIFEST" ":s3:${R2_BUCKET}/dist/application-manifest-${VERSION}.json"
          rclone copy application-update-metadata/application-blobs ":s3:${R2_BUCKET}/application-blobs"
          cmp "$MANIFEST" <(rclone cat "${REMOTE}/dist/application-manifest-${VERSION}.json")

          # Preserve the current atomic channel before replacing it.
          rollback=$(mktemp -d)
          rclone copyto "${REMOTE}/dist/application.json" "$rollback/application.json"
          restore_pointer() {
            echo "Release publication failed; restoring the previous channel."
            rclone copyto "$rollback/application.json" "${REMOTE}/dist/application.json"
          }
          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              restore_pointer
            fi
            exit "$status"
          }
          trap on_exit EXIT

          # One pointer publishes the matching application and content together. The
          # legacy latest.json remains pinned for launchers that predate this safeguard.
          rclone copyto application.json "${REMOTE}/dist/application.json"
          test "$(rclone cat "${REMOTE}/dist/application.json" | jq -r .version)" = "$VERSION"
          test "$(rclone cat "${REMOTE}/dist/application.json" | jq -r .content.version)" = "$VERSION"

          base="${REB2_CONTENT_BASE_URL%/}"
          published=false
          for attempt in 1 2 3 4 5 6; do
            release=$(curl --fail --location --silent --show-error "$base/dist/application.json") || {
              sleep 5
              continue
            }
            application_version=$(jq -r .version <<<"$release")
            content_version=$(jq -r .content.version <<<"$release")
            if [ "$application_version" = "$VERSION" ] && [ "$content_version" = "$VERSION" ]; then
              published=true
              break
            fi
            sleep 5
          done
          test "$published" = true

          # The installer remains hidden until its exact application/content pair
          # is live. If publishing the Release fails, on_exit restores the channel.
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          trap - EXIT

  # ---------------------------------------------------------------------------
  # PARKED: Linux installer.
  #
  # Linux still needs a matching player workflow call, a native Tauri launcher,
  # AppImage packaging, and per-platform application updates.
  # ---------------------------------------------------------------------------
