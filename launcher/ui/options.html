<button class="options-toggle" type="button" title="Options" aria-label="Options"
  onclick="window.location.href='@@ACT@@?choice=options'">
  <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <path stroke-linejoin="round" d="m9.4 3-.6 2.2-1.5.9-2.2-.6-2.6 4.5 1.6 1.6v1.8L2.5 15l2.6 4.5 2.2-.6 1.5.9.6 2.2h5.2l.6-2.2 1.5-.9 2.2.6 2.6-4.5-1.6-1.6v-1.8l1.6-1.6-2.6-4.5-2.2.6-1.5-.9L14.6 3z" />
    <circle cx="12" cy="12.5" r="3.2" />
  </svg>
</button>
<dialog class="options-dialog" id="launcher-options" aria-labelledby="options-title">
  <button class="options-close" type="button" aria-label="Close options" onclick="document.getElementById('launcher-options').close()">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
  </button>
  <h2 id="options-title">Options</h2>
  <form id="launcher-options-form">
    <label for="graphics-api">Graphics API</label>
    <select id="graphics-api" name="graphics-api">@@GRAPHICS_API_OPTIONS@@</select>
    @@AUDIO_OPTIONS@@
    <p class="options-hint">Applies the next time you launch the game or content pack editor.</p>
    <p class="options-error" id="options-error" role="alert"></p>
    <div class="options-actions">
      <button class="b secondary" type="button" onclick="document.getElementById('launcher-options').close()">Cancel</button>
      <button class="b primary" id="options-save" type="submit">Save</button>
    </div>
  </form>
</dialog>
<script>
  (function () {
    var pendingScreen = null;
    window.rebRenderScreen = function (html) {
      if (document.getElementById("launcher-options").open) {
        pendingScreen = html;
        return;
      }
      document.open();
      document.write(html);
      document.close();
    };
    document.getElementById("launcher-options").addEventListener("close", function () {
      if (pendingScreen !== null) window.rebRenderScreen(pendingScreen);
    });
    window.rebOpenOptions = function (value, audio, error) {
      document.getElementById("graphics-api").value = value;
      var audioSelect = document.getElementById("audio-backend");
      if (audioSelect) audioSelect.value = audio;
      document.getElementById("options-error").textContent = error || "";
      document.getElementById("options-save").disabled = false;
      document.getElementById("launcher-options").showModal();
      document.getElementById("graphics-api").focus();
    };
    window.rebOptionsSaved = function (error) {
      document.getElementById("options-save").disabled = false;
      if (error) {
        document.getElementById("options-error").textContent = error;
      } else {
        document.getElementById("launcher-options").close();
      }
    };
    document.getElementById("launcher-options-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("options-save").disabled = true;
      var value = document.getElementById("graphics-api").value;
      var audioSelect = document.getElementById("audio-backend");
      var audio = audioSelect ? audioSelect.value : "auto";
      window.location.href = "@@ACT@@?choice=save-options:" + encodeURIComponent(value + ":" + audio);
    });
  })();
</script>
