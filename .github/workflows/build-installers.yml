name: Build Installers

# Tag-driven, launcher-model installer build.
#
# Push a tag like `v0.0.2` to cut a release: this builds the ASSET-FREE game
# player, builds the launcher, stamps the game exe icon, packages a per-user
# Inno installer, and publishes it to a GitHub Release named after the tag.
# Content (art) is NOT in the installer — the launcher downloads content.zip
# from R2 after ownership verification.
#
# workflow_dispatch is the escape hatch for test builds (no Release is cut).
#
# Currently Windows-complete. macOS/Linux jobs are parked below until the
# Windows path is validated end to end (see the commented block).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "rebellion2 (game) ref to build"
        required: false
        default: "master"
      version:
        description: "Version string (blank = 0.0.0-dev for dispatch builds)"
        required: false
        default: ""

env:
  UNITY_VERSION: 6000.4.0f1

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="0.0.0-dev"
          fi
          echo "Resolved version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  validate-infrastructure-access:
    name: Validate infrastructure repository access
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2-infrastructure
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: infra

      - name: Verify content publisher
        run: test -f infra/content/package.sh

  player:
    name: Build asset-free player (Windows)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false

      # Pin the game to the release tag so builds are reproducible: a tag build checks
      # out rebellion2@<tag>; a dispatch build uses source_ref (default master).
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: game

      # Media (content pack + main-menu models) is needed at BUILD time for prefab
      # authoring/previews. StandalonePlayerBuild strips Assets/Content from the
      # final player and verifies it did not leak, so the shipped player stays
      # asset-free — the real content ships separately as content.zip on R2.
      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: game/.ci/rebellion2-media

      - name: Pull media LFS from R2
        working-directory: game/.ci/rebellion2-media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          for attempt in 1 2 3; do
            if git lfs pull --include="Content/**,Models/MainMenu/**" --exclude=""; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Media LFS pull failed; retrying in ${delay} seconds."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content Models/MainMenu; then
            echo "Media checkout still contains Git LFS pointers."; exit 1
          fi

      - name: Install media (editor-preview content + main-menu models)
        working-directory: game
        run: |
          mkdir -p Assets/Content Assets/Art/Models/MainMenu
          test -f .ci/rebellion2-media/Content/Application/Schemas/game-config.xsd
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Content/ Assets/Content/
          rsync -a --delete --exclude=.DS_Store --exclude='*.meta' .ci/rebellion2-media/Models/MainMenu/ Assets/Art/Models/MainMenu/
          rm -rf .ci

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: Rebellion2
          buildsPath: build
          buildMethod: StandalonePlayerBuild.Build
          customParameters: -buildVersion ${{ needs.prepare.outputs.version }}
          allowDirtyBuild: true

      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: player-windows
          path: build/StandaloneWindows64
          if-no-files-found: error

  publish-content:
    name: Publish content + update layer to R2
    if: github.ref_type == 'tag'
    runs-on: macos-latest  # tar is bsdtar here, which package.sh needs for zip creation
    needs: prepare
    steps:
      - name: Checkout media (git only, no LFS)
        uses: actions/checkout@v4
        with:
          repository: adasgames/rebellion2-media
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          ssh-key: ${{ secrets.REBELLION2_MEDIA_SSH_KEY }}
          persist-credentials: false
          lfs: false
          path: media

      - name: Pull media LFS from R2
        working-directory: media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          git lfs install
          HOST="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@rebellion2-lfs-proxy.pages.dev/${HOST}/${R2_BUCKET}"
          for attempt in 1 2 3; do
            if git lfs pull --include="Content/**" --exclude=""; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Media LFS pull failed; retrying in ${delay} seconds."
            sleep "$delay"
          done
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' Content; then
            echo "Media checkout still contains Git LFS pointers."; exit 1
          fi

      - name: Checkout infrastructure (publish script)
        uses: actions/checkout@v4
        with:
          repository: davidadas/rebellion2-infrastructure
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: infra

      - name: Install rclone
        run: brew install rclone

      # Publishes dist/content-<ver>.zip (first-install), plus the incremental
      # update layer the launcher patches from: dist/manifest-<ver>.json,
      # blobs/<sha256>, and dist/latest.json. Derived from one file set so they
      # can't drift.
      - name: Publish content.zip + manifest + blobs + latest.json
        env:
          MEDIA_DIR: ${{ github.workspace }}/media
          VERSION: ${{ needs.prepare.outputs.version }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash infra/content/package.sh

  windows-installer:
    name: Package Windows installer
    runs-on: windows-latest
    needs: [prepare, player]
    steps:
      - name: Checkout installer repo (packaging)
        uses: actions/checkout@v4

      - name: Download player
        uses: actions/download-artifact@v4
        with:
          name: player-windows
          path: player

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build launcher
        working-directory: launcher/src-tauri
        env:
          # Baked into the launcher so it requests its own content pack (content-<ver>.zip).
          # The version IS the release tag — game and media are checked out at that tag.
          REB2_CONTENT_VERSION: ${{ needs.prepare.outputs.version }}
          # Content channel the launcher scans for updates and pulls token-gated
          # patches from. Kept in a repo secret so the worker URL isn't committed.
          REB2_CONTENT_BASE_URL: ${{ secrets.REB2_CONTENT_BASE_URL }}
        run: cargo build --release

      - name: Stamp game exe icon
        shell: pwsh
        run: |
          choco install rcedit -y --no-progress
          rcedit "player\Rebellion2.exe" --set-icon "launcher\src-tauri\icons\icon.ico"

      - name: Package installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc `
            /DGameDir="$PWD\player" `
            /DLauncherPath="$PWD\launcher\src-tauri\target\release\rebellion2-launcher.exe" `
            /DAppVersion="${{ needs.prepare.outputs.version }}" `
            /DOutputDir="$PWD\dist" `
            /DIconFile="$PWD\launcher\src-tauri\icons\icon.ico" `
            packaging\windows\rebellion2-launcher.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [prepare, publish-content, windows-installer]
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rebellion 2 ${GITHUB_REF_NAME}" \
            --notes "Automated build of Rebellion 2 ${GITHUB_REF_NAME}. Unsigned; see README for install notes. The installer is asset-free — the launcher downloads game content after ownership verification." \
            dist/*.exe

      - name: Sign installer + publish launcher-update pointer
        env:
          LAUNCHER_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          INSTALLER=$(ls dist/*.exe | head -1)
          NAME=$(basename "$INSTALLER")
          # ed25519-sign the installer bytes (seed -> PKCS8) so the launcher verifies it.
          SIG=$(node -e '
            const c=require("crypto"),fs=require("fs");
            const seed=Buffer.from(process.env.LAUNCHER_SIGNING_KEY.trim(),"hex");
            const pkcs8=Buffer.concat([Buffer.from("302e020100300506032b657004220420","hex"),seed]);
            const key=c.createPrivateKey({key:pkcs8,format:"der",type:"pkcs8"});
            process.stdout.write(c.sign(null,fs.readFileSync(process.argv[1]),key).toString("hex"));
          ' "$INSTALLER")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${NAME}"
          printf '{"version":"%s","url":"%s","signature":"%s"}' "$VERSION" "$URL" "$SIG" > launcher.json
          echo "launcher.json -> $(cat launcher.json)"
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          RCLONE_S3_PROVIDER=Cloudflare \
          RCLONE_S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          RCLONE_S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          RCLONE_S3_ENDPOINT="$R2_ENDPOINT" \
          RCLONE_S3_REGION=auto \
            rclone copyto launcher.json ":s3:${R2_BUCKET}/dist/launcher.json"

  # ---------------------------------------------------------------------------
  # PARKED: macOS and Linux installers.
  #
  # The launcher-model Windows path is validated first. macOS/Linux each need:
  #   - a matching asset-free player (add StandaloneOSX / StandaloneLinux64 to
  #     the `player` job as a matrix, or add sibling jobs),
  #   - a per-OS launcher build (Tauri does not cross-compile: macos-latest and
  #     ubuntu-latest runners),
  #   - per-OS packaging (macOS: .app -> zip/dmg, ideally signed+notarized;
  #     Linux: AppImage via packaging/linux/build-appimage.sh),
  #   - per-OS icon handling.
  # Unpark once the Windows job is green.
  # ---------------------------------------------------------------------------
