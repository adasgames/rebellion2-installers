<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam verification — Rebellion II</title>
    <style>{{shared_styles}}</style>
    <style>{{screen_styles}}</style>
  </head>
  <body>
    <main class="card steam-verification">
      <header class="launcher-brand" aria-label="Rebellion II launcher">
        <h1>REBELLION <span class="two">II</span></h1>
        <span>Launcher</span>
      </header>
      <section class="recovery-content" aria-labelledby="verification-title">
        <p class="kicker">Ownership verification</p>
        <h2 id="verification-title">Steam verification</h2>
        <p class="failure-error" id="s" role="status" aria-live="polite">{{status}}</p>
        <section class="visibility-panel" aria-label="Steam account visibility">
          <p class="panel-label">Steam account</p>
          <dl>
            <div><dt>Profile</dt><dd class="{{profile_state}}">{{profile}}</dd></div>
            <div><dt>Game list</dt><dd class="{{game_list_state}}">{{game_list}}</dd></div>
          </dl>
        </section>
        <section class="recovery-guidance" aria-labelledby="guidance-title">
          <h3 id="guidance-title">{{guidance_title}}</h3>
          <p>{{guidance}}</p>
        </section>
      </section>
      <footer class="btns recovery-actions">
        <p>After making changes in Steam, return here and retry.</p>
        {{buttons}}
      </footer>
    </main>
    <script>
      window.rebSetStatus = function (label) {
        document.getElementById("s").textContent = label;
      };
    </script>
  </body>
</html>
