<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rebellion 2 Launcher</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif; color: #e8ecf6;
        background:
          radial-gradient(1200px 800px at 70% -10%, #1a2547 0%, transparent 55%),
          radial-gradient(900px 700px at 10% 110%, #241238 0%, transparent 50%),
          linear-gradient(180deg, #0b1226, #05070f);
        display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none;
      }
      body::before {
        content: ""; position: fixed; inset: 0;
        background-image:
          radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent),
          radial-gradient(1px 1px at 80% 20%, #cdd 50%, transparent),
          radial-gradient(1.5px 1.5px at 60% 70%, #fff 50%, transparent),
          radial-gradient(1px 1px at 35% 80%, #bcd 50%, transparent),
          radial-gradient(1px 1px at 90% 60%, #fff 50%, transparent),
          radial-gradient(1.5px 1.5px at 12% 65%, #eef 50%, transparent);
        opacity: 0.5; pointer-events: none;
      }
      .card {
        position: relative; width: min(94vw, 440px); height: min(560px, 92vh); overflow: hidden; padding: 40px 34px 30px;
        background: rgba(16, 22, 43, 0.72); border: 1px solid rgba(120, 160, 255, 0.18);
        border-radius: 18px; backdrop-filter: blur(14px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        display: flex; flex-direction: column; text-align: center;
      }
      .kicker { letter-spacing: .42em; font-size: 11px; color: #ffcf4d; text-transform: uppercase; margin: 0 0 12px; opacity: .9; }
      h1 { margin: 0; font-size: clamp(24px, 8vw, 40px); font-weight: 800; letter-spacing: .1em; line-height: 1.05; }
      h1 .two { color: #ffcf4d; }
      .sub { margin: 16px auto 24px; max-width: 34ch; color: #8a93ad; font-size: 14.5px; line-height: 1.6; min-height: 20px; }
      .spin { width: 28px; height: 28px; border: 2.5px solid rgba(255,255,255,.14); border-top-color: #ffcf4d; border-radius: 50%; animation: sp .8s linear infinite; margin: 4px auto; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .bar { width: 100%; height: 7px; background: rgba(255,255,255,.08); border-radius: 5px; overflow: hidden; display: none; margin-top: 4px; }
      .f { height: 100%; width: 0%; background: linear-gradient(90deg, #ffcf4d, #ffb43d); transition: width .3s; }
      .p { font-size: 11.5px; color: #8a93ad; min-height: 0; margin-top: 8px; }
      .btns { margin-top: auto; }
      .b { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px 18px; margin: 11px 0 0; border-radius: 11px; font-size: 15px; font-weight: 700; text-decoration: none; }
      .b.disabled { background: rgba(255,255,255,.06); color: #5b6479; cursor: default; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">Checking for updates</p>
      <h1>REBELLION <span class="two">II</span></h1>
      <p class="sub" id="s">Looking for a newer version…</p>
      <div class="spin"></div>
      <div class="bar" id="bar"><div class="f" id="f"></div></div>
      <div class="p" id="p"></div>
      <div class="btns"><span class="b disabled">Launch Game</span></div>
    </main>
    <script>
      window.rebSetProgress = function (percent, label) {
        var bar = document.getElementById("bar"); if (bar) bar.style.display = "block";
        var f = document.getElementById("f"); if (f) f.style.width = percent + "%";
        var p = document.getElementById("p"); if (p) p.textContent = percent > 0 ? percent + "%" : "";
        if (label) { var s = document.getElementById("s"); if (s) s.textContent = label; }
      };
      window.rebSetStatus = function (label) { var s = document.getElementById("s"); if (s) s.textContent = label; };
    </script>
  </body>
</html>
